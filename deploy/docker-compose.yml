# Local development stack: `docker compose -f deploy/docker-compose.yml up`.
#
# Ports bind to 127.0.0.1 only. A gateway that holds provider credentials must
# not be reachable from the LAN because someone started it on a laptop in a
# cafe.
#
# The OTLP backend is not in here. W07 already ships telemetry to an existing
# collector through OTEL_EXPORTER_OTLP_ENDPOINT; standing up a second one would
# be a backend nobody asked for. Leave the variable unset and the gateway runs
# with no exporter at all.

name: agent-pool-gateway

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway-dev}
      POSTGRES_DB: gateway
    ports:
      # Not 5432: a developer machine usually already has something there, and
      # a stack that refuses to start on a shared laptop is a stack nobody runs.
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 0.0.0.0 inside the container; the published port below is what keeps
      # this off the LAN.
      LISTEN_ADDRESS: 0.0.0.0:8080
      DATABASE_URL: postgres://gateway:${POSTGRES_PASSWORD:-gateway-dev}@postgres:5432/gateway
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      ADMIN_DATABASE_MAX_CONNECTIONS: ${ADMIN_DATABASE_MAX_CONNECTIONS:-2}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace-me}
      OPENAI_PROVIDER: ${OPENAI_PROVIDER:-openai}
      OPENAI_REQUEST_MAX_BYTES: ${OPENAI_REQUEST_MAX_BYTES:-33554432}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-replace-me}
      ANTHROPIC_PROVIDER: ${ANTHROPIC_PROVIDER:-anthropic}
      ANTHROPIC_REQUEST_MAX_BYTES: ${ANTHROPIC_REQUEST_MAX_BYTES:-33554432}
      STREAM_EVENT_MAX_BYTES: ${STREAM_EVENT_MAX_BYTES:-33554432}
      ENABLE_DEVELOPMENT_BOOTSTRAP: ${ENABLE_DEVELOPMENT_BOOTSTRAP:-false}
      BOOTSTRAP_CLIENT_KEY: ${BOOTSTRAP_CLIENT_KEY:-}
      CREDENTIAL_HASH_KEY: ${CREDENTIAL_HASH_KEY:-development-only-credential-hash-key}
      CREDENTIAL_HASH_KEY_ID: ${CREDENTIAL_HASH_KEY_ID:-v1}
      CREDENTIAL_RETIRING_HASH_KEYS: ${CREDENTIAL_RETIRING_HASH_KEYS:-}
      CREDENTIAL_ENVIRONMENT: ${CREDENTIAL_ENVIRONMENT:-dev}
      CREDENTIAL_CACHE_CAPACITY: ${CREDENTIAL_CACHE_CAPACITY:-1024}
      CREDENTIAL_CACHE_TTL_SECONDS: ${CREDENTIAL_CACHE_TTL_SECONDS:-60}
      POLICY_CACHE_CAPACITY: ${POLICY_CACHE_CAPACITY:-1024}
      POLICY_CACHE_TTL_SECONDS: ${POLICY_CACHE_TTL_SECONDS:-60}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
      ADMIN_BOOTSTRAP_TENANT_ID: ${ADMIN_BOOTSTRAP_TENANT_ID:-}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-900}
      ADMIN_ALLOWED_ORIGIN: ${ADMIN_ALLOWED_ORIGIN:-http://127.0.0.1:5173}
      ADMIN_TRUSTED_PROXY_IPS: ${ADMIN_TRUSTED_PROXY_IPS:-}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-company-default}
      LEDGER_SPOOL_DIR: /var/lib/agent-pool-gateway/ledger-spool
      LEDGER_SPOOL_MAX_BYTES: ${LEDGER_SPOOL_MAX_BYTES:-67108864}
      LEDGER_SPOOL_ENTRY_MAX_BYTES: ${LEDGER_SPOOL_ENTRY_MAX_BYTES:-32768}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RUST_LOG: ${RUST_LOG:-info,opentelemetry_sdk=warn,opentelemetry_otlp=warn}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ledger-spool:/var/lib/agent-pool-gateway/ledger-spool
    healthcheck:
      # Readiness, not liveness: "the stack is up" should mean the gateway can
      # actually reach its database.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  ledger-spool:
